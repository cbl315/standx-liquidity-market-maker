# StandX 做市机器人配置文件

# 链配置
chain: bsc  # bsc | solana

# StandX API
api:
  base_url: https://api.standx.com
  perps_url: https://perps.standx.com
  timeout: 30s

# 做市策略配置
strategy:
  symbol: BTC-USD
  order_qty: 0.004         # BTC
  spread_bps: 18          # 挂单价差 (10 bps 以内)

# 风险管理配置（SL/TP 自动平仓）
risk:
  enabled: true               # 是否启用风险管理
  sl_tp_bps: 1                # SL/TP 价格浮动范围 (1-2bp)
  min_balance_ratio: 0.2      # 最低余额比例 (保留20%用于保证金)
  check_interval: 1s          # 余额检查间隔

# WebSocket 配置
websocket:
  url: wss://perps.standx.com/ws-stream/v1
  ping_interval: 10s     # 服务器 Ping 间隔
  pong_timeout: 5m       # Pong 超时断开时间
  reconnect_delay: 5s    # 重连延迟

# 监控配置
monitor:
  uptime_threshold: 0.70  # 70% 在线时间目标
  log_interval: 5m        # 状态日志间隔

# 时间窗口配置（北京时间）
time_window:
  enabled: true              # 是否启用时间窗口控制
  timezone: "Asia/Shanghai"  # 时区
  windows:                   # 禁止运行的时间窗口
    - start: "22:00"         # 开始时间
      end: "06:00"           # 结束时间（支持跨天）
      weekdays: [1,2,3,4] # 星期一到星期五（1=周一, 7=周日）
  action: "shutdown"         # 窗口期内操作: shutdown (停止运行) | pause (暂停下单)

# 波动保护配置
volatility:
  enabled: true              # 是否启用波动保护
  threshold_bps: 20          # 波动阈值（基点），20 bps = 0.2%
  window_sec: 60             # 检测窗口时长（秒）
  min_snapshots: 5           # 最小快照数量，避免样本太少误判

# 仓位冷却配置（吃单后马上平单，然后进入冷静期）
position_cooldown:
  enabled: true              # 是否启用仓位监控
  check_interval: 15s         # 检查间隔
  cooldown_duration: 60s     # 冷却时长

# 日志配置
log:
  level: info  # debug | info | warn | error
  format: text # json | text
